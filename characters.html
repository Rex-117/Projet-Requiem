<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/fontawesome.min.css"
    />
    <link
      rel="shortcut icon"
      href="assets/img/favicon 2.png"
      type="image/x-icon"
    />
    <title>Resident Evil Requiem — Character</title>
  </head>
  <body>
    <nav class="main-nav">
      <button
        type="button"
        class="nav-toggle"
        aria-expanded="false"
        aria-controls="nav-menu"
      >
        <i class="fa-solid fa-bars"></i>
      </button>

      <ul id="nav-menu" class="nav-menu">
        <li><a href="index.html" class="nav-link">Accueil</a></li>
        <li><a href="index.html#about" class="nav-link">À propos</a></li>
        <li><a href="index.html#story" class="nav-link">Histoire</a></li>
        <li><a href="index.html#locations" class="nav-link">Lieux</a></li>
        <li><a href="index.html#gameplay" class="nav-link">Gameplay</a></li>
        <li>
          <a href="index.html#collaboration" class="nav-link">Collaboration</a>
        </li>
        <li>
          <a href="characters.html" class="nav-link is-active">Personnages</a>
        </li>
        <li><a href="trailer.html" class="nav-link">Trailers</a></li>
        <li><a href="credits.html" class="nav-link">Crédits</a></li>
      </ul>

      <!-- ---------------------------------------------------------
           Background music mute toggle — circle button. Hover reveals a vertical volume
           slider below it; clicking the icon mutes/unmutes.
      --------------------------------------------------------- -->
      <div class="audio-player" data-audio-player>
        <button
          type="button"
          class="audio-player__toggle"
          data-audio-toggle
          aria-label="Couper / activer le son"
        >
          <img
            class="fa-solid fa-volume-high"
            src="assets/img/speaker.png"
            alt=""
            srcset=""
            data-audio-icon
          />
          <!-- <i class="fa-solid fa-volume-high" data-audio-icon></i> -->
        </button>
        <div class="audio-player__panel" data-audio-panel>
          <input
            type="range"
            class="audio-player__range"
            data-audio-range
            min="0"
            max="100"
            step="1"
            value="100"
            aria-label="Volume"
          />
        </div>
        <audio data-audio-element loop preload="auto">
          <source src="assets/audio/Bonus Theme.mp3" type="audio/mpeg" />
        </audio>
      </div>
    </nav>

    <!-- ---------------------------------------------------------
         Character — filled in by injectionScript.js
    --------------------------------------------------------- -->
    <main class="info-section" data-character-section="confirmed">
      <div class="info-section__bg" aria-hidden="true"></div>
      <div class="info-section__inner">
        <h2 class="info-title">Characters</h2>

        <!-- Small thumbnail strip -->
        <div class="character-switcher">
          <button
            type="button"
            class="character-switcher__arrow"
            data-character-prev
            aria-label="Previous character"
          >
            <img src="assets/img/icon_arrow_small.webp" alt="" srcset="" />
            <!-- <i class="fa-solid fa-arrow-left"></i> -->
          </button>
          <div class="character-switcher__track" data-character-track></div>
          <button
            type="button"
            class="character-switcher__arrow-right"
            data-character-next
            aria-label="Next character"
          >
            <img src="assets/img/icon_arrow_small.webp" alt="" srcset="" />
            <!-- <i class="fa-solid fa-arrow-right"></i> -->
          </button>
        </div>

        <!-- "Images 1 – 2 – 3 – 4 – 5" -->
        <div class="media-slider__nav" data-character-images-nav></div>

        <!-- Big peek carousel -->
        <div class="location-slider character-slider" data-character-slider>
          <div class="location-slider__track" data-character-slider-track></div>
        </div>

        <div class="character-info">
          <h3 class="character-info__name" data-character-name></h3>
          <div class="character-info__row">
            <div class="character-info__bio" data-character-bio></div>
            <aside class="character-info__specs">
              <h4 class="character-info__specs-title">Character information</h4>
              <div data-character-specs></div>
            </aside>
          </div>
        </div>
      </div>
    </main>

    <section class="info-section" data-character-section="unconfirmed">
      <div class="info-section__bg" aria-hidden="true"></div>
      <div class="info-section__inner">
        <h2 class="info-title">Personnages susceptibles de revenir</h2>

        <!-- Small thumbnail strip -->
        <div class="character-switcher">
          <button
            type="button"
            class="character-switcher__arrow"
            data-character-prev
            aria-label="Previous character"
          >
            <img src="assets/img/icon_arrow_small.webp" alt="" srcset="" />
            <!-- <i class="fa-solid fa-arrow-left"></i> -->
          </button>
          <div class="character-switcher__track" data-character-track></div>
          <button
            type="button"
            class="character-switcher__arrow-right"
            data-character-next
            aria-label="Next character"
          >
            <img src="assets/img/icon_arrow_small.webp" alt="" srcset="" />
            <!-- <i class="fa-solid fa-arrow-right"></i> -->
          </button>
        </div>

        <!-- "Images 1 – 2 – 3 – 4 – 5" -->
        <div class="media-slider__nav" data-character-images-nav></div>

        <!-- Big peek carousel -->
        <div class="location-slider character-slider" data-character-slider>
          <div class="location-slider__track" data-character-slider-track></div>
        </div>

        <div class="character-info">
          <h3 class="character-info__name" data-character-name></h3>
          <div class="character-info__row">
            <div class="character-info__bio" data-character-bio></div>
            <aside class="character-info__specs">
              <h4 class="character-info__specs-title">
                Informations sur les personnages
              </h4>
              <div data-character-specs></div>
            </aside>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------------------------------------------------
         Model viewer — pulls "model_video" from characters.json.
         Only characters with a non-empty model_video show up in the
         switcher here; the section hides itself if none do yet.
    --------------------------------------------------------- -->
    <section class="info-section" data-model-viewer-section>
      <div class="info-section__bg" aria-hidden="true"></div>
      <div class="info-section__inner">
        <h2 class="info-title">Model Viewer</h2>

        <div class="character-switcher">
          <button
            type="button"
            class="character-switcher__arrow"
            data-model-viewer-prev
            aria-label="Previous character"
          >
            <img src="assets/img/icon_arrow_small.webp" alt="" srcset="" />
          </button>
          <div class="character-switcher__track" data-model-viewer-track></div>
          <button
            type="button"
            class="character-switcher__arrow-right"
            data-model-viewer-next
            aria-label="Next character"
          >
            <img src="assets/img/icon_arrow_small.webp" alt="" srcset="" />
          </button>
        </div>

        <div class="model-viewer">
          <div class="model-viewer__frame">
            <video
              class="model-viewer__video"
              data-model-viewer-video
              controls
              loop
              autoplay
              muted
              playsinline
            ></video>
          </div>
        </div>

        <div class="character-info">
          <h3 class="character-info__name" data-model-viewer-name></h3>
        </div>
      </div>
    </section>

    <script src="https://unpkg.com/lenis@1.3.15/dist/lenis.min.js"></script>
    <script src="index.js"></script>
    <script src="injectionScript.js"></script>
  </body>
</html>
