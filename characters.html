    <!-- ---------------------------------------------------------
         Character — filled in by injectionScript.js
    --------------------------------------------------------- -->
    <main id="character" class="info-section">
      <div class="info-section__bg" aria-hidden="true"></div>
      <div class="info-section__inner">
        <h2 class="info-title">Character</h2>

        <!-- Small thumbnail strip -->
        <div class="character-switcher">
          <button
            type="button"
            class="character-switcher__arrow"
            data-character-prev
            aria-label="Previous character"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <div class="character-switcher__track" data-character-track></div>
          <button
            type="button"
            class="character-switcher__arrow"
            data-character-next
            aria-label="Next character"
          >
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

        <!-- "Images 1 – 2 – 3 – 4 – 5" -->
        <div class="media-slider__nav" data-character-images-nav></div>

        <!-- Big peek carousel -->
        <div class="location-slider character-slider" data-character-slider>
          <div class="location-slider__track" data-character-slider-track></div>
        </div>

        <div class="character-info">
          <h3 class="character-info__name" data-character-name></h3>
          <div class="character-info__bio" data-character-bio></div>
        </div>
      </div>
    </main>
