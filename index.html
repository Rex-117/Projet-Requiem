<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/fontawesome.min.css"
    />
    <link
      rel="shortcut icon"
      href="img/samurai-favicon.png"
      type="image/x-icon"
    />
    <title>Resident Evil Requiem</title>
  </head>
  <body>
    <!-- the title -->
    <section class="header">
      <div class="video-container">
        <video autoplay muted loop playsinline class="bg-video">
          <source src="assets/video/mainVisual_bg.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <div class="video-content"></div>
      </div>
      <nav>
        <div class="header_menu_wrap" style="opacity: 1">
          <ul class="header_menu ff-se2">
            <li>
              <button type="button" class="btn">
                <span class="btn_inner"
                  ><span class="btn_txt" aria-hidden="true">Accueil</span
                  ><span class="hidden">Accueil</span></span
                >
              </button>
            </li>
            <li>
              <button type="button" class="btn">
                <span class="btn_inner"
                  ><span class="new"></span
                  ><span class="btn_txt" aria-hidden="true">News</span
                  ><span class="hidden">News</span></span
                >
              </button>
            </li>
            <li>
              <button type="button" class="btn">
                <span class="btn_inner"
                  ><span class="new"></span
                  ><span class="btn_txt" aria-hidden="true">Trailers</span
                  ><span class="hidden">Trailers</span></span
                >
              </button>
            </li>
            <li>
              <button type="button" class="btn">
                <span class="btn_inner"
                  ><span class="btn_txt" aria-hidden="true">À propos</span
                  ><span class="hidden">À propos</span></span
                >
              </button>
            </li>
            <li>
              <button type="button" class="btn">
                <span class="btn_inner"
                  ><span class="btn_txt" aria-hidden="true">Histoire</span
                  ><span class="hidden">Histoire</span></span
                >
              </button>
            </li>
            <li>
              <button type="button" class="btn">
                <span class="btn_inner"
                  ><span class="new"></span
                  ><span class="btn_txt" aria-hidden="true">Personnages</span
                  ><span class="hidden">Personnages</span></span
                >
              </button>
            </li>
            <li>
              <button type="button" class="btn">
                <span class="btn_inner"
                  ><span class="new"></span
                  ><span class="btn_txt" aria-hidden="true">Lieux</span
                  ><span class="hidden">Lieux</span></span
                >
              </button>
            </li>
            <li>
              <button type="button" class="btn">
                <span class="btn_inner"
                  ><span class="btn_txt" aria-hidden="true">Gameplay</span
                  ><span class="hidden">Gameplay</span></span
                >
              </button>
            </li>
            <li>
              <button type="button" class="btn">
                <span class="btn_inner"
                  ><span class="new"></span
                  ><span class="btn_txt" aria-hidden="true">Produits</span
                  ><span class="hidden">Produits</span></span
                >
              </button>
            </li>
          </ul>
          <a class="product_btn gtm-products-link" href="/requiem/fr/products/"
            >Disponible<img
              alt=""
              loading="lazy"
              decoding="async"
              data-nimg="fill"
              class="product_btn_bg_img"
              src="/requiem/assets/images/common/parts/bg_btn_1.webp"
              style="
                position: absolute;
                height: 100%;
                width: 100%;
                inset: 0px;
                color: transparent;
              "
          /></a>
        </div>
      </nav>
      <div class="text-box">
        <h1 class="logo img_wrap">
          <img
            alt="Resident Evil Requiem"
            width="881"
            height="342"
            decoding="async"
            data-nimg="1"
            src="/assets/img/logo_w.webp"
            style="color: transparent"
          />
        </h1>
        <p class="text_release ff-se">Disponible le 27 février 2026</p>
        <a href="" target="" class="visit-button">À propos</a>
      </div>
    </section>
    <section>
      <div></div>
    </section>
  </body>
</html>
